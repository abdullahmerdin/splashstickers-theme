# Shopify Theme Check Configuration
# Hermes Architectural Standards — v3.0.0
root: .
require: []

# Liquid
LiquidSyntaxCheck:
  enabled: true
UndefinedObject:
  enabled: true
DeprecatedFilter:
  enabled: true
DeprecatedTag:
  enabled: true
MissingRequiredTemplate:
  enabled: true
TemplateLength:
  enabled: true
  max_length: 300

# Performance
ImgWidthAndHeight:
  enabled: true
ParserBlockingScript:
  enabled: true
AssetSizeCSS:
  enabled: true
  threshold_in_bytes: 102400
AssetSizeJavaScript:
  # Theme-wide legacy assets are intentionally retained; Shopify's default
  # Theme Check configuration disables this performance-only check for themes.
  enabled: false
  threshold_in_bytes: 16384
ContentForHeaderModification:
  enabled: true
RemoteAsset:
  enabled: true
UnusedAssign:
  enabled: true
UnusedCssSelectors:
  enabled: true

# Best Practices
DefaultShopifyLiquid:
  enabled: true
NestedSnippet:
  enabled: true
MatchingTranslations:
  enabled: true
RequiredTranslation:
  enabled: true
