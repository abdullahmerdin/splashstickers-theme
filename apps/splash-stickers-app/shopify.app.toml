# This file stores configurations for your Shopify app. Shopify CLI fills the
# development URLs when this source tree runs through `shopify app dev`.
name = "Splash Gangsheet Builder"
client_id = "72e5218f676eb676f1492300ebe47d76"
application_url = "https://splash-gangsheet-builder.onrender.com"
embedded = true
handle = "splash-stickers"

[build]
automatically_update_urls_on_dev = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_files,read_orders,read_products,write_app_proxy,write_files"

[webhooks]
api_version = "2026-07"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/webhooks/orders/paid"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[app_proxy]
url = "https://splash-gangsheet-builder.onrender.com/apps/splash-stickers/"
subpath = "splash-stickers"
prefix = "apps"

[auth]
redirect_urls = [
  "https://splash-gangsheet-builder.onrender.com/auth/callback"
]
