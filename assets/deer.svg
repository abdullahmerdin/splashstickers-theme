<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="500" height="500">
  <defs>
    <!-- Woven texture background -->
    <pattern id="weave" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0,4 l4,-4 M-1,1 l2,-2 M3,5 l2,-2" stroke="#1f4a2b" stroke-width="1" opacity="0.8" />
      <path d="M0,0 l4,4 M-1,3 l2,2 M3,-1 l2,2" stroke="#255530" stroke-width="1" opacity="0.8" />
    </pattern>
    
    <!-- Drop shadow for the entire patch -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Shadow to make the emoji pop and look thick/stitched -->
    <filter id="stitch-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="1" flood-color="#000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="-1" stdDeviation="0.5" flood-color="#fff" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Patch Base Edge -->
  <circle cx="125" cy="125" r="110" fill="#2d6a4f" filter="url(#drop-shadow)" />
  
  <!-- Woven Texture Layer -->
  <circle cx="125" cy="125" r="110" fill="url(#weave)" />

  <!-- Thick Merrowed Border (Outer edge of patch) -->
  <!-- Simulating heavy embroidery thread wrapped around the edge -->
  <circle cx="125" cy="125" r="105" fill="none" stroke="#d4af37" stroke-width="12" />
  <circle cx="125" cy="125" r="105" fill="none" stroke="#b39129" stroke-width="12" stroke-dasharray="2 3" />
  <circle cx="125" cy="125" r="105" fill="none" stroke="#ffe066" stroke-width="4" stroke-dasharray="1 4" />
  
  <!-- Inner line stitch -->
  <circle cx="125" cy="125" r="94" fill="none" stroke="#e0c067" stroke-width="2" stroke-dasharray="5 3" />

  <!-- Outer text around the edge -->
  <path id="curve-top" d="M 50 125 A 75 75 0 0 1 200 125" fill="none" />
  <path id="curve-bottom" d="M 200 125 A 75 75 0 0 1 50 125" fill="none" />
  
  <text font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#f0c63c" letter-spacing="2" filter="url(#stitch-shadow)">
    <textPath href="#curve-top" startOffset="50%" text-anchor="middle">WILDERNESS</textPath>
  </text>
  
  <text font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#f0c63c" letter-spacing="2" filter="url(#stitch-shadow)">
    <textPath href="#curve-bottom" startOffset="50%" text-anchor="middle">CLUB</textPath>
  </text>

  <!-- Center Emoji with outline/shadow to look embroidered -->
  <text x="125" y="150" font-size="70" text-anchor="middle" filter="url(#stitch-shadow)">🦌</text>

  <!-- Side decorative stars -->
  <text x="45" y="131" font-size="18" text-anchor="middle" fill="#f0c63c" filter="url(#stitch-shadow)">★</text>
  <text x="205" y="131" font-size="18" text-anchor="middle" fill="#f0c63c" filter="url(#stitch-shadow)">★</text>
</svg>