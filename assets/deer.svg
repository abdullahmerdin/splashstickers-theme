<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Sticker Base (Contour) -->
  <path d="M 200 70
           C 160 60, 140 10, 100 20
           C 50 30, 70 120, 80 130
           C 30 140, 20 200, 40 240
           C 60 280, 120 280, 140 290
           C 160 340, 240 340, 260 290
           C 280 280, 340 280, 360 240
           C 380 200, 370 140, 320 130
           C 330 120, 350 30, 300 20
           C 260 10, 240 60, 200 70 Z" 
        fill="#F7F4EB" />
  
  <!-- Dashed Cut Line (Contour) -->
  <path d="M 200 70
           C 160 60, 140 10, 100 20
           C 50 30, 70 120, 80 130
           C 30 140, 20 200, 40 240
           C 60 280, 120 280, 140 290
           C 160 340, 240 340, 260 290
           C 280 280, 340 280, 360 240
           C 380 200, 370 140, 320 130
           C 330 120, 350 30, 300 20
           C 260 10, 240 60, 200 70 Z" 
        fill="none" stroke="#333333" stroke-width="2.5" stroke-dasharray="10,10" 
        transform="translate(200, 175) scale(0.91) translate(-200, -175)" />

  <!-- Antlers (Drawn behind the head) -->
  <!-- Left Antler -->
  <path d="M 165 160 Q 150 90 100 60" fill="none" stroke="#5C3A21" stroke-width="12" stroke-linecap="round" />
  <path d="M 140 110 Q 120 100 105 115" fill="none" stroke="#5C3A21" stroke-width="10" stroke-linecap="round" />
  <path d="M 125 80 Q 140 50 155 50" fill="none" stroke="#5C3A21" stroke-width="10" stroke-linecap="round" />
  
  <!-- Right Antler -->
  <path d="M 235 160 Q 250 90 300 60" fill="none" stroke="#5C3A21" stroke-width="12" stroke-linecap="round" />
  <path d="M 260 110 Q 280 100 295 115" fill="none" stroke="#5C3A21" stroke-width="10" stroke-linecap="round" />
  <path d="M 275 80 Q 260 50 245 50" fill="none" stroke="#5C3A21" stroke-width="10" stroke-linecap="round" />

  <!-- Ears (Drawn behind the head) -->
  <!-- Left Ear -->
  <path d="M 145 175 C 90 135, 45 170, 75 210 C 105 230, 135 220, 155 195 Z" fill="#A87A51" />
  <path d="M 135 180 C 100 155, 65 180, 85 205 C 105 215, 125 210, 140 195 Z" fill="#E8D0B3" />
  
  <!-- Right Ear -->
  <path d="M 255 175 C 310 135, 355 170, 325 210 C 295 230, 265 220, 245 195 Z" fill="#A87A51" />
  <path d="M 265 180 C 300 155, 335 180, 315 205 C 295 215, 275 210, 260 195 Z" fill="#E8D0B3" />

  <!-- Main Head Base -->
  <path d="M 200 145 C 255 145, 275 185, 265 240 C 255 285, 225 300, 200 300 C 175 300, 145 285, 135 240 C 125 185, 145 145, 200 145 Z" fill="#A87A51" />

  <!-- Forehead Spots -->
  <ellipse cx="200" cy="155" rx="5" ry="8" fill="#E8D0B3" opacity="0.6"/>
  <ellipse cx="180" cy="165" rx="4" ry="7" fill="#E8D0B3" opacity="0.6" transform="rotate(-20 180 165)" />
  <ellipse cx="220" cy="165" rx="4" ry="7" fill="#E8D0B3" opacity="0.6" transform="rotate(20 220 165)" />

  <!-- Blush -->
  <ellipse cx="145" cy="230" rx="12" ry="8" fill="#D96C75" opacity="0.4" />
  <ellipse cx="255" cy="230" rx="12" ry="8" fill="#D96C75" opacity="0.4" />

  <!-- Snout -->
  <ellipse cx="200" cy="265" rx="35" ry="28" fill="#E8D0B3" />

  <!-- Nose -->
  <ellipse cx="200" cy="255" rx="16" ry="10" fill="#222222" />
  <ellipse cx="196" cy="252" rx="5" ry="3" fill="#FFFFFF" opacity="0.5"/>

  <!-- Mouth -->
  <path d="M 200 265 L 200 275 Q 185 288 175 278 M 200 275 Q 215 288 225 278" fill="none" stroke="#222222" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Eyes -->
  <circle cx="155" cy="210" r="14" fill="#222222" />
  <circle cx="245" cy="210" r="14" fill="#222222" />
  
  <!-- Eye Highlights -->
  <circle cx="150" cy="205" r="5" fill="#FFFFFF" />
  <circle cx="240" cy="205" r="5" fill="#FFFFFF" />
</svg>