<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Sticker Base (Contour) -->
  <path d="M 180 60 
           C 200 35, 250 35, 280 50 
           C 305 60, 325 70, 320 90 
           C 315 110, 295 115, 285 125 
           C 315 130, 350 170, 350 240 
           C 350 305, 310 325, 270 320 
           C 230 315, 215 295, 200 295 
           C 185 295, 170 315, 130 320 
           C 90 325, 50 305, 50 240 
           C 50 170, 95 130, 130 120 
           C 150 115, 160 85, 180 60 Z" 
        fill="#F7F4EB" />
  
  <!-- Dashed Cut Line (Contour) -->
  <path d="M 180 60 
           C 200 35, 250 35, 280 50 
           C 305 60, 325 70, 320 90 
           C 315 110, 295 115, 285 125 
           C 315 130, 350 170, 350 240 
           C 350 305, 310 325, 270 320 
           C 230 315, 215 295, 200 295 
           C 185 295, 170 315, 130 320 
           C 90 325, 50 305, 50 240 
           C 50 170, 95 130, 130 120 
           C 150 115, 160 85, 180 60 Z" 
        fill="none" stroke="#333333" stroke-width="2.5" stroke-dasharray="10,10" 
        transform="translate(200, 185) scale(0.91) translate(-200, -185)" />

  <!-- Cherry Stems -->
  <path d="M 210 90 Q 160 130 130 195" fill="none" stroke="#4E342E" stroke-width="8" stroke-linecap="round" />
  <path d="M 210 90 Q 240 130 270 195" fill="none" stroke="#4E342E" stroke-width="8" stroke-linecap="round" />
  
  <!-- Stem Joint -->
  <circle cx="210" cy="90" r="5" fill="#4E342E" />

  <!-- Cherry Leaf -->
  <path d="M 210 90 C 230 55, 285 55, 290 75 C 285 100, 230 105, 210 90 Z" fill="#43A047" />
  <!-- Leaf Vein -->
  <path d="M 215 90 Q 250 82 280 77" fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round" />

  <!-- Left Cherry -->
  <circle cx="130" cy="240" r="55" fill="#E53935" />
  <!-- Left Cherry Dimple -->
  <path d="M 115 190 Q 130 205 145 190" fill="none" stroke="#B71C1C" stroke-width="4" stroke-linecap="round" />
  <!-- Left Cherry Highlight -->
  <path d="M 90 220 A 30 30 0 0 1 110 195" fill="none" stroke="#FFCDD2" stroke-width="6" stroke-linecap="round" />

  <!-- Right Cherry -->
  <circle cx="270" cy="240" r="55" fill="#E53935" />
  <!-- Right Cherry Dimple -->
  <path d="M 255 190 Q 270 205 285 190" fill="none" stroke="#B71C1C" stroke-width="4" stroke-linecap="round" />
  <!-- Right Cherry Highlight -->
  <path d="M 230 220 A 30 30 0 0 1 250 195" fill="none" stroke="#FFCDD2" stroke-width="6" stroke-linecap="round" />
</svg>