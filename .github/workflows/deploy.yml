name: Deploy Theme to Shopify

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Push theme to Shopify
        run: |
          shopify theme push \
            --store=${{ secrets.SHOPIFY_STORE }} \
            --password=${{ secrets.SHOPIFY_PASSWORD }} \
            --theme=${{ secrets.SHOPIFY_THEME_ID }} \
            --unpublished \
            --json
        env:
          SHOPIFY_CLI_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLI_PASSWORD: ${{ secrets.SHOPIFY_PASSWORD }}
